<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <link rel="icon" href="./favicon.ico" type="image/x-icon">
        <title>Mol* Root Transform</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 100%; height: 100%; overflow: hidden; }
            #app { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
        </style>
        <link rel="stylesheet" type="text/css" href="molstar.css" />
    </head>
    <body>
        <div id="app"></div>
        <script type="text/javascript" src="./molstar.js"></script>
        <script type="text/javascript">
            molstar.Viewer.create('app', {
                layoutShowControls: true,
                viewportShowExpand: false,
                disabledExtensions: [],
            }).then(viewer => {
                window.viewer = viewer;
                const plugin = viewer.plugin;

                viewer.loadPdb('1tqn');

                plugin.canvas3dInitialized.then(() => {
                    const mgr = molstar.PluginExtensions.transformGizmo.getManager(plugin);
                    window.boxManager = mgr;
                });

                window.addEventListener('unload', () => viewer.dispose());
            });
        </script>
    </body>
</html>
